name: biometric_storage_web
description: Web implementation of the biometric_storage federated plugin.
version: 5.1.1-dev.2
homepage: https://github.com/authpass/biometric_storage/
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.4.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  biometric_storage_platform_interface:
    path: ../biometric_storage_platform_interface
  flutter_secure_storage: '>=10.0.0 <11.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=5.0.0 <7.0.0'

flutter:
  plugin:
    implements: biometric_storage
    platforms:
      web:
        pluginClass: BiometricStorageWeb
        fileName: biometric_storage_web.dart
